<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulation d'entretien</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Simulation d'entretien</h1>
    <button id="reset-btn" class="ghost-btn hidden">Nouvel entretien</button>
  </header>

  <main>
    <section id="setup" class="panel">
      <h2>Configure ton entretien</h2>
      <label class="field">
        Type d'entretien
        <select id="type-entretien">
          <option value="">Indifférent</option>
          <option value="RH">RH</option>
          <option value="technique">Technique</option>
          <option value="direction">Direction</option>
        </select>
      </label>
      <label class="field">
        Domaine du poste visé
        <input id="domaine" type="text" placeholder="ex : tech, commerce, finance, industrie (optionnel)" />
      </label>
      <label class="field">
        Offre d'emploi visée (optionnel)
        <textarea id="offre" rows="6" placeholder="Colle ici le texte de l'offre pour que le recruteur se mette dans la peau de l'entreprise et pose des questions ancrées sur ce poste précis."></textarea>
      </label>
      <div class="start-actions">
        <button id="start-chat-btn" class="primary-btn">💬 Commencer en Chat Écrit</button>
        <button id="start-call-btn" class="call-btn">📞 Lancer l'Appel Téléphonique</button>
      </div>
      <p id="setup-error" class="error hidden"></p>
    </section>

    <!-- Écran d'Appel Téléphonique -->
    <section id="call-screen" class="panel hidden">
      <div class="call-header">
        <div class="avatar-container">
          <div class="avatar">👔</div>
          <div class="pulse-ring"></div>
        </div>
        <h2 id="call-recruiter-name">RH Senior — Recruteur</h2>
        <p id="call-timer" class="call-timer">00:00</p>
        <p id="call-status" class="call-status">Connexion à l'appel…</p>
      </div>

      <div class="call-transcript-container">
        <div id="call-captions" class="call-captions">
          <p class="caption-text recruiter">Connexion en cours...</p>
        </div>
      </div>

      <div class="call-controls">
        <button id="mic-toggle-btn" class="control-btn mic-btn" title="Activer / Désactiver le micro">
          <span class="mic-icon">🎙️</span>
          <span id="mic-label">Parler</span>
        </button>
        <button id="end-call-btn" class="control-btn hangup-btn" title="Raccrocher et obtenir le bilan">
          <span>📞</span> Raccrocher
        </button>
      </div>
    </section>

    <!-- Panneau de Chat Écrit classique -->
    <section id="chat" class="panel hidden">
      <div id="messages" class="messages"></div>
      <div id="typing" class="typing hidden">Le recruteur réfléchit…</div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" placeholder="Ta réponse au recruteur…" rows="2"></textarea>
        <div class="chat-actions">
          <button type="button" id="mic-chat-btn" class="icon-btn" title="Parler au micro (Whisper)">🎙️</button>
          <button type="submit" class="primary-btn">Envoyer</button>
          <button type="button" id="end-btn" class="secondary-btn">Terminer & Obtenir le bilan</button>
        </div>
        <p id="mic-chat-status" class="mic-status hidden">🔴 Enregistrement vocal en cours… Parle puis clique à nouveau pour envoyer.</p>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
